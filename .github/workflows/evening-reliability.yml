name: Evening reliability
on:
  push:
    branches: [fix/evening-reliability-20261015]
permissions:
  contents: read
jobs:
  isolated-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Install test-only dependencies without production access
        working-directory: web
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Prepare isolated database binaries
        run: |
          mkdir -p /tmp/offline-tools/pg-lib
          docker run --rm -v /tmp/offline-tools:/out postgres:17-bookworm sh -c '
            cp -a /usr/lib/postgresql/17 /out/postgresql
            cp -a /usr/share/postgresql/17 /out/pg-share
            for bin in postgres psql initdb; do
              ldd /usr/lib/postgresql/17/bin/$bin | awk '\''/=> \/.* \(/ {print $3}'\'' | grep -vE "libc\.so|libm\.so|libpthread|libdl\.so" | xargs -r -I{} cp -L {} /out/pg-lib/
            done
          '
      - name: Package offline verification tools
        run: |
          mkdir -p /tmp/offline-tools/bin
          cp "$(command -v deno)" /tmp/offline-tools/bin/deno
          cp "$(command -v supabase)" /tmp/offline-tools/bin/supabase
          tar -czf /tmp/offline-tools/node_modules.tar.gz -C web node_modules
          tar -czf /tmp/offline-tools/playwright-browsers.tar.gz -C "$HOME/.cache" ms-playwright
          tar -czf /tmp/offline-verification-tools.tar.gz -C /tmp/offline-tools .
      - uses: actions/upload-artifact@v4
        with:
          name: evening-offline-verification-tools
          path: /tmp/offline-verification-tools.tar.gz
          retention-days: 1
