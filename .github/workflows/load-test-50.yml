name: read-only 50-user production load test
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/load_test_50.py'
      - '.github/workflows/load-test-50.yml'
jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test 50 concurrent clients against each read-only endpoint
        id: load
        continue-on-error: true
        run: python3 scripts/load_test_50.py
      - name: Publish test results to repository for review
        if: always()
        run: |
          if [ -f test-results/load-50.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test-results/load-50.json
            if ! git diff --cached --quiet; then
              git commit -m "test: publish latest 50-client read-only load results [skip ci]"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-50-report
          path: test-results/load-50.json
      - name: Fail if load test failed
        if: steps.load.outcome == 'failure'
        run: exit 1
