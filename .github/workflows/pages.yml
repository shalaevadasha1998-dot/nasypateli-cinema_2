name: Deploy Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_DEMO_MODE: "false"
      VITE_SUPABASE_URL: "https://vwteokawtqnoiyzmsldj.supabase.co"
      VITE_API_FUNCTION: "app"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build
        working-directory: web
        run: npm run build -- --base=/nasypateli-cinema_2/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production site
        run: |
          node <<'NODE'
          const url='https://shalaevadasha1998-dot.github.io/nasypateli-cinema_2/'
          let html=''
          for(let i=0;i<12;i++){
            const r=await fetch(url,{cache:'no-store'})
            if(r.ok){html=await r.text();if(html.includes('НАСЫПАТЕЛИ В КИНО'))break}
            await new Promise(resolve=>setTimeout(resolve,5000))
          }
          if(!html.includes('НАСЫПАТЕЛИ В КИНО'))throw new Error('Production index is not live')
          const refs=[...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map(x=>new URL(x[1],url).href)
          if(!refs.length)throw new Error('Production assets were not found')
          for(const asset of refs){
            const r=await fetch(asset,{method:'GET',cache:'no-store'})
            if(!r.ok)throw new Error('Production asset failed: '+asset+' '+r.status)
          }
          console.log('Production site and assets are reachable')
          NODE
