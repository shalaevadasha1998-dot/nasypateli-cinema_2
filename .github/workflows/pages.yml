name: Deploy Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_DEMO_MODE: "false"
      VITE_SUPABASE_URL: "https://vwteokawtqnoiyzmsldj.supabase.co"
      VITE_API_FUNCTION: "app"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack v0.6.4
        run: |
          rm -rf app app-web
          mkdir -p app
          unzip -q -o nasypateli-cinema-mvp-v0.6.4.zip -d app

          PACKAGE_JSON="$(find app -type f -path '*/web/package.json' -print -quit)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo "Could not find web/package.json"
            exit 1
          fi

          WEB_DIR="$(dirname "$PACKAGE_JSON")"
          mkdir -p app-web
          cp -a "$WEB_DIR"/. app-web/

      - name: Fix GitHub Pages routing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app-web/src/App.tsx")
          if not path.exists():
              raise SystemExit(0)

          text = path.read_text()
          old = "<BrowserRouter><Routes>"
          new = "<BrowserRouter basename={import.meta.env.BASE_URL}><Routes>"

          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build
        run: |
          cd app-web
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build -- --base=/nasypateli-cinema_2/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: app-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
