name: UI and rehearsal smoke
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_DEMO_MODE: "false"
      VITE_SUPABASE_URL: "https://vwteokawtqnoiyzmsldj.supabase.co"
      VITE_API_FUNCTION: "app"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app and browser test dependencies
        working-directory: web
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build app
        working-directory: web
        run: npm run build -- --base=/nasypateli-cinema_2/
      - name: Test desktop and mobile layouts against test room
        working-directory: web
        run: node tests/smoke.mjs
      - name: Android viewport, touch and rehearsal/feedback tests
        working-directory: web
        run: node tests/android-smoke.mjs
      - name: Verify admin-only test roles and ticket QR gallery scanner on Android
        working-directory: web
        run: node tests/admin-rehearsal-smoke.mjs
      - name: Full guest journey and failure recovery
        working-directory: web
        run: node --experimental-strip-types tests/guest-journey.mjs
      - name: Verify projector recovery and live guest transition
        working-directory: web
        run: node --experimental-strip-types tests/projector-recovery.mjs
      - name: Build isolated demo UI
        working-directory: web
        env:
          VITE_DEMO_MODE: "true"
        run: npm run build -- --base=/nasypateli-cinema_2/
      - name: Verify onboarding interactions and responsive layouts
        working-directory: web
        run: node tests/demo-smoke.mjs
      - name: Verify admin controls and navigation on mobile and desktop
        working-directory: web
        run: node tests/director-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-rehearsal-screenshots
          path: web/test-artifacts/*.png
          if-no-files-found: ignore
      - name: Publish UI smoke result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const state=process.env.JOB_STATUS==='success'?'success':'failure'
          const payload={
            state,context:'nasypateli/ui-smoke',
            description:state==='success'?'Playwright desktop+mobile smoke passed':'Playwright UI smoke failed',
            target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          }
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,{
            method:'POST',headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'user-agent':'github-actions','content-type':'application/json'},body:JSON.stringify(payload)
          })
          if(!response.ok)throw new Error('Could not publish UI smoke status '+response.status)
          NODE
