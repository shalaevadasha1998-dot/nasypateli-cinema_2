name: Deploy Supabase Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: vwteokawtqnoiyzmsldj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions"
            exit 2
          fi

      - name: Deploy app Edge Function
        run: supabase functions deploy app --project-ref "$PROJECT_ID" --use-api

      - name: Verify live function version
        run: |
          node <<'NODE'
          const endpoint='https://vwteokawtqnoiyzmsldj.supabase.co/functions/v1/app'
          for(let i=0;i<12;i++){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'health'})})
            const data=await r.json().catch(()=>({}))
            if(r.ok&&data?.version==='0.9.0'){console.log('Supabase v0.9.0 is live');process.exit(0)}
            await new Promise(resolve=>setTimeout(resolve,5000))
          }
          throw new Error('Supabase v0.9.0 did not become live')
          NODE
