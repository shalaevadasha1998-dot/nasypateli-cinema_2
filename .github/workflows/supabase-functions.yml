name: Deploy Supabase Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADMIN_TELEGRAM_USERNAMES: ${{ secrets.ADMIN_TELEGRAM_USERNAMES }}
      TELEGRAM_PROVIDER_TOKEN: ${{ secrets.TELEGRAM_PROVIDER_TOKEN }}
      PROJECT_ID: vwteokawtqnoiyzmsldj

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Verify deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions"
            exit 2
          fi

      - name: Configure managed runtime secrets
        run: |
          SCREEN_ACCESS_TOKEN="$(printf '%s' "nasypateli-screen-v1:$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          CRON_ACCESS_TOKEN="$(printf '%s' "nasypateli-cron-v1:$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$SCREEN_ACCESS_TOKEN"
          echo "::add-mask::$CRON_ACCESS_TOKEN"

          supabase secrets set             SCREEN_ACCESS_TOKEN="$SCREEN_ACCESS_TOKEN"             CRON_ACCESS_TOKEN="$CRON_ACCESS_TOKEN"             TELEGRAM_WEBAPP_URL="https://shalaevadasha1998-dot.github.io/nasypateli-cinema_2/"             --project-ref "$PROJECT_ID"

          if [ -n "$ADMIN_TELEGRAM_USERNAMES" ]; then
            supabase secrets set ADMIN_TELEGRAM_USERNAMES="$ADMIN_TELEGRAM_USERNAMES" --project-ref "$PROJECT_ID"
          fi

          if [ -n "$TELEGRAM_PROVIDER_TOKEN" ]; then
            supabase secrets set TELEGRAM_PROVIDER_TOKEN="$TELEGRAM_PROVIDER_TOKEN" --project-ref "$PROJECT_ID"
          fi

      - name: Deploy app Edge Function
        run: supabase functions deploy app --project-ref "$PROJECT_ID" --use-api

      - name: Verify production migration history matches git
        run: |
          node <<'NODE'
          ;(async()=>{
          const fs=require('fs')
          const path=require('path')
          const files=fs.readdirSync(path.join(process.cwd(),'supabase','migrations'))
            .filter(name=>/^\d{14}_.+\.sql$/.test(name))
            .sort()
          const local=files.map(name=>({version:name.slice(0,14),name:name.slice(15,-4)}))
          const response=await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_ID}/database/query`,{
            method:'POST',
            headers:{
              authorization:`Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
              'content-type':'application/json'
            },
            body:JSON.stringify({
              query:'select version, name from supabase_migrations.schema_migrations order by version',
              read_only:true
            })
          })
          const raw=await response.text()
          if(!response.ok)throw new Error(`Could not read production migration history: HTTP ${response.status} ${raw.slice(0,500)}`)
          let payload
          try{payload=JSON.parse(raw)}catch{throw new Error('Production migration history returned invalid JSON')}
          const rows=Array.isArray(payload)?payload:Array.isArray(payload?.result)?payload.result:Array.isArray(payload?.data)?payload.data:[]
          if(!rows.length&&local.length)throw new Error('Production migration history returned no rows')
          const remote=new Map(rows.map(row=>[String(row.version),String(row.name||'')]))
          const localMap=new Map(local.map(row=>[row.version,row.name]))
          const missingRemote=local.filter(row=>!remote.has(row.version))
          const missingLocal=[...remote.entries()].filter(([version])=>!localMap.has(version))
          const renamed=local.filter(row=>remote.has(row.version)&&remote.get(row.version)!==row.name)
          if(missingRemote.length||missingLocal.length||renamed.length){
            throw new Error([
              missingRemote.length?`not applied in production: ${missingRemote.map(x=>x.version+'_'+x.name).join(', ')}`:'',
              missingLocal.length?`production-only migrations: ${missingLocal.map(([v,n])=>v+'_'+n).join(', ')}`:'',
              renamed.length?`name mismatch: ${renamed.map(x=>x.version+' local='+x.name+' production='+remote.get(x.version)).join(', ')}`:''
            ].filter(Boolean).join(' | '))
          }
          console.log(`Migration history synchronized: ${local.length} migrations`)
          })().catch(error=>{console.error(error);process.exit(1)})
          NODE

      - name: Verify core production readiness
        run: |
          node <<'NODE'
          const endpoint='https://vwteokawtqnoiyzmsldj.supabase.co/functions/v1/app'
          let last={}
          for(let i=0;i<12;i++){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'health'})})
            const data=await r.json().catch(()=>({}))
            last={status:r.status,data}
            if(r.ok&&data?.version==='0.9.0'){
              const blockers=Object.entries(data?.checks||{}).filter(([,ok])=>ok!==true).map(([name])=>name)
              if(blockers.length===0){
                console.log('Supabase v0.9.0 is live and ready')
                console.log(JSON.stringify(data.checks||{}))
                process.exit(0)
              }
              if(blockers.length===1&&blockers[0]==='payments'){
                console.log('::warning::Payments are intentionally pending: TELEGRAM_PROVIDER_TOKEN is not configured')
                console.log('Supabase v0.9.0 core runtime is live and ready')
                console.log(JSON.stringify(data.checks||{}))
                process.exit(0)
              }
            }
            console.log('Waiting for Supabase runtime checks',JSON.stringify(last))
            await new Promise(resolve=>setTimeout(resolve,3000))
          }
          throw new Error('Supabase production runtime checks failed: '+JSON.stringify(last))
          NODE

      - name: Publish Supabase deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const state=process.env.JOB_STATUS==='success'?'success':'failure'
          const body={
            state,
            context:'nasypateli/supabase-production',
            description:state==='success'?'Supabase deploy + core readiness green':'Supabase deploy or core readiness failed',
            target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          }
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,{
            method:'POST',
            headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'user-agent':'github-actions','content-type':'application/json'},
            body:JSON.stringify(body)
          })
          if(!r.ok)throw new Error('Could not publish Supabase status: '+r.status+' '+await r.text())
          NODE
