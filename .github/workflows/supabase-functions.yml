name: Deploy Supabase Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADMIN_TELEGRAM_USERNAMES: ${{ secrets.ADMIN_TELEGRAM_USERNAMES }}
      TELEGRAM_PROVIDER_TOKEN: ${{ secrets.TELEGRAM_PROVIDER_TOKEN }}
      PROJECT_ID: vwteokawtqnoiyzmsldj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions"
            exit 2
          fi

      - name: Configure managed runtime secrets
        run: |
          SCREEN_ACCESS_TOKEN="$(printf '%s' "nasypateli-screen-v1:$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          CRON_ACCESS_TOKEN="$(printf '%s' "nasypateli-cron-v1:$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$SCREEN_ACCESS_TOKEN"
          echo "::add-mask::$CRON_ACCESS_TOKEN"

          supabase secrets set             SCREEN_ACCESS_TOKEN="$SCREEN_ACCESS_TOKEN"             CRON_ACCESS_TOKEN="$CRON_ACCESS_TOKEN"             --project-ref "$PROJECT_ID"

          if [ -n "$ADMIN_TELEGRAM_USERNAMES" ]; then
            supabase secrets set ADMIN_TELEGRAM_USERNAMES="$ADMIN_TELEGRAM_USERNAMES" --project-ref "$PROJECT_ID"
          fi

          if [ -n "$TELEGRAM_PROVIDER_TOKEN" ]; then
            supabase secrets set TELEGRAM_PROVIDER_TOKEN="$TELEGRAM_PROVIDER_TOKEN" --project-ref "$PROJECT_ID"
          fi

      - name: Deploy app Edge Function
        run: supabase functions deploy app --project-ref "$PROJECT_ID" --use-api

      - name: Verify production readiness
        run: |
          node <<'NODE'
          const endpoint='https://vwteokawtqnoiyzmsldj.supabase.co/functions/v1/app'
          let last={}
          for(let i=0;i<12;i++){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'health'})})
            const data=await r.json().catch(()=>({}))
            last={status:r.status,data}
            if(r.ok&&data?.version==='0.9.0'){
              const blockers=Object.entries(data?.checks||{}).filter(([,ok])=>ok!==true).map(([name])=>name)
              if(blockers.length===0){
                console.log('Supabase v0.9.0 is live and ready')
                console.log(JSON.stringify(data.checks||{}))
                process.exit(0)
              }
              if(blockers.length===1&&blockers[0]==='payments'){
                throw new Error('Production blocker: TELEGRAM_PROVIDER_TOKEN is not configured')
              }
            }
            console.log('Waiting for Supabase runtime checks',JSON.stringify(last))
            await new Promise(resolve=>setTimeout(resolve,3000))
          }
          throw new Error('Supabase production runtime checks failed: '+JSON.stringify(last))
          NODE

      - name: Publish Supabase deploy status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const state=process.env.JOB_STATUS==='success'?'success':'failure'
          const body={
            state,
            context:'nasypateli/supabase-production',
            description:state==='success'?'Supabase v0.9.0 is live and ready':'Supabase deploy or readiness failed',
            target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          }
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,{
            method:'POST',
            headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'user-agent':'github-actions','content-type':'application/json'},
            body:JSON.stringify(body)
          })
          if(!r.ok)throw new Error('Could not publish Supabase status: '+r.status+' '+await r.text())
          NODE
