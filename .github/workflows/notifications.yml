name: Dispatch Notifications

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ENDPOINT: https://vwteokawtqnoiyzmsldj.supabase.co/functions/v1/app

    steps:
      - name: Verify dispatcher credential
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions"
            exit 2
          fi

      - name: Dispatch due notifications
        run: |
          CRON_ACCESS_TOKEN="$(printf '%s' "nasypateli-cron-v1:$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$CRON_ACCESS_TOKEN"

          body='{"action":"cron-notifications"}'
          result="$(curl --fail-with-body --silent --show-error             --retry 2 --retry-delay 2 --retry-all-errors             -H "content-type: application/json"             -H "x-cron-token: $CRON_ACCESS_TOKEN"             --data "$body"             "$ENDPOINT")"

          echo "$result" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>{
              const data=JSON.parse(s);
              if(data?.ok!==true)throw new Error("notification dispatch failed: "+s);
              console.log("Notification dispatch OK:", JSON.stringify({
                checked:Number(data.checked||0),
                sent:Number(data.sent||0)
              }));
            });
          '
