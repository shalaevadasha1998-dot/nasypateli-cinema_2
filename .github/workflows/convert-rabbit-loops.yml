name: Build rabbit loops

on:
  push:
    paths:
      - "web/public/assets/rabbit-boy.webm"
      - "web/public/assets/rabbit-girl.webm"
      - "web/public/assets/rabbit-splash-back.webm"
      - ".github/workflows/convert-rabbit-loops.yml"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert decorative rabbit loops
        run: |
          ffmpeg -y -i web/public/assets/rabbit-boy.webm             -vf "fps=10,scale=160:224:flags=lanczos"             -loop 0 -c:v libwebp -q:v 45 -compression_level 6 -preset picture             web/public/assets/rabbit-boy-animated.webp

          ffmpeg -y -i web/public/assets/rabbit-girl.webm             -vf "fps=10,scale=160:224:flags=lanczos"             -loop 0 -c:v libwebp -q:v 45 -compression_level 6 -preset picture             web/public/assets/rabbit-girl-animated.webp

          ffmpeg -y -i web/public/assets/rabbit-splash-back.webm             -vf "fps=10,scale=160:224:flags=lanczos"             -loop 0 -c:v libwebp -q:v 45 -compression_level 6 -preset picture             web/public/assets/rabbit-splash-back-animated.webp

      - name: Commit generated loops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/assets/*-animated.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: generate ios-safe rabbit animations"
          git push
