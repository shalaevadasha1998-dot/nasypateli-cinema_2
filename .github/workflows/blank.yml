name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack application
        run: |
          rm -rf app app-web
          mkdir -p app
          unzip -q -o nasypateli-cinema-mvp-v0.9.0.zip -d app

          PACKAGE_JSON="$(find app -type f -path '*/web/package.json' -print -quit)"
          if [ -z "$PACKAGE_JSON" ]; then
            echo "Could not find web/package.json"
            exit 1
          fi

          WEB_DIR="$(dirname "$PACKAGE_JSON")"
          mkdir -p app-web
          cp -a "$WEB_DIR"/. app-web/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app-web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        working-directory: app-web
        run: npm run lint --if-present

      - name: Typecheck
        working-directory: app-web
        run: npm run typecheck --if-present

      - name: Test
        working-directory: app-web
        env:
          CI: "true"
        run: npm test --if-present

      - name: Build
        working-directory: app-web
        run: npm run build
