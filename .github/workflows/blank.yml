name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate migration filenames
        shell: bash
        run: |
          shopt -s nullglob
          declare -A seen=()
          for file in supabase/migrations/*.sql; do
            base="${file##*/}"
            if [[ ! "$base" =~ ^[0-9]{14}_.+\.sql$ ]]; then
              echo "Invalid migration filename: $base"
              exit 1
            fi
            version="${base%%_*}"
            if [[ -n "${seen[$version]:-}" ]]; then
              echo "Duplicate migration version: $version"
              exit 1
            fi
            seen[$version]=1
          done

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify static asset references
        run: |
          node <<'NODE'
          const fs=require('fs')
          const path=require('path')
          const sourceRoot=path.join(process.cwd(),'web','src')
          const assetRoot=path.join(process.cwd(),'web','public','assets')
          const sourceFiles=[]
          function walk(dir){
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const full=path.join(dir,entry.name)
              if(entry.isDirectory())walk(full)
              else if(/\.(?:ts|tsx|css)$/.test(entry.name))sourceFiles.push(full)
            }
          }
          walk(sourceRoot)
          const refs=new Map()
          const patterns=[
            /assets\/([A-Za-z0-9._-]+\.(?:png|webp|jpe?g|gif|svg))/g,
            /['"`]([A-Za-z0-9._-]+\.(?:png|webp|jpe?g|gif|svg))['"`]/g
          ]
          for(const file of sourceFiles){
            const source=fs.readFileSync(file,'utf8')
            for(const pattern of patterns){
              pattern.lastIndex=0
              for(const match of source.matchAll(pattern)){
                const name=match[1]
                if(!refs.has(name))refs.set(name,[])
                refs.get(name).push(path.relative(process.cwd(),file))
              }
            }
          }
          const missing=[...refs.keys()].filter(name=>!fs.existsSync(path.join(assetRoot,name)))
          if(missing.length){
            throw new Error('Missing public assets: '+missing.join(', '))
          }
          console.log('Static asset references verified:',refs.size)
          NODE

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build
        working-directory: web
        run: npm run build

      - name: Production API smoke test
        run: |
          node <<'NODE'
          const endpoint='https://vwteokawtqnoiyzmsldj.supabase.co/functions/v1/app'
          async function post(body){
            const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
            let data={}
            try{data=await r.json()}catch{}
            return {status:r.status,data}
          }

          let health
          for(let i=0;i<6;i++){
            health=await post({action:'health'})
            if(health.status===200&&health.data?.ok===true&&health.data?.version==='0.9.0')break
            console.log('Waiting for production API',JSON.stringify(health))
            await new Promise(resolve=>setTimeout(resolve,3000))
          }
          if(health?.status!==200||health?.data?.ok!==true||health?.data?.version!=='0.9.0'){
            throw new Error('Production API health failed: '+JSON.stringify(health))
          }

          const admin=await post({action:'admin-bootstrap',slug:'2026-10-03'})
          if(admin.status!==401)throw new Error('Admin endpoint is not protected: '+JSON.stringify(admin))
          const screen=await post({action:'screen-bootstrap',slug:'2026-10-03'})
          if(screen.status!==401)throw new Error('Screen endpoint is not protected: '+JSON.stringify(screen))
          const cron=await post({action:'cron-notifications'})
          if(cron.status!==401)throw new Error('Notification cron endpoint is not protected: '+JSON.stringify(cron))

          const blockers=Object.entries(health.data?.checks||{}).filter(([,ok])=>ok!==true).map(([name])=>name)
          const hardBlockers=blockers.filter(name=>name!=='payments')
          if(hardBlockers.length)throw new Error('Production readiness blockers: '+hardBlockers.join(', '))
          if(blockers.includes('payments'))console.log('::warning::Payments are intentionally pending: TELEGRAM_PROVIDER_TOKEN is not configured')
          console.log('Production API health, auth gates and core readiness are OK')
          NODE

      - name: Publish CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const state=process.env.JOB_STATUS==='success'?'success':'failure'
          const body={
            state,
            context:'nasypateli/ci-production-ready',
            description:state==='success'?'Build + core production readiness are green':'Build or core production readiness failed',
            target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          }
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`,{
            method:'POST',
            headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,'user-agent':'github-actions','content-type':'application/json'},
            body:JSON.stringify(body)
          })
          if(!r.ok)throw new Error('Could not publish CI status: '+r.status+' '+await r.text())
          NODE
